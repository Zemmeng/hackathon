# deploy.yml —— 手动触发的 Cloudflare 部署（GitHub 网页上点按钮部署的备用通道）
#
# 🔒 只能手动触发（workflow_dispatch），绝不因为 push / PR 自动部署。
# 🔒 只有 DEPLOYER 能跑：hackathon.conf 的 DEPLOYER 与触发人 github.actor 比对（不分大小写），不一致直接拒绝。
# 🔒 只有 lead 在 GitHub 仓库 Settings → Secrets and variables → Actions 里
#    填了 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID 之后才能用。详见 docs/deploy-cloudflare.md。
# 用途：Actions → deploy → Run workflow，填 module：
#       <模块名>  部署 apps/<模块名>
#       all       按 hackathon.conf 的 DEPLOY_MODULES 逐个部署（一次一个，不并行）
# 部署前（plan job）依次检查：Secrets 已填 → 触发人是 DEPLOYER → 冻结期规则 → bash scripts/check.sh 全量无 ❌。
# 冻结期：bash scripts/check.sh --time-raw 的 PHASE 是「代码冻结」或「已截止」时，
#       只能在「Use workflow from」里选 demo-* tag 部署；确需从分支热修，勾选 hotfix（事后在 decisions 记一条）。
# 部署完读 hackathon.conf 的 DEMO_URL 跑 bash scripts/check.sh --e2e 冒烟（DEMO_URL 为空就跳过）。
# 日常部署首选本地 bash scripts/deploy.sh（同样的前置检查）；这里是没有本地环境时的备用。

name: deploy

on:
  workflow_dispatch:
    inputs:
      module:
        description: "apps/ 下的模块名；all = 按 hackathon.conf 的 DEPLOY_MODULES 逐个部署"
        required: true
        default: all
        type: string
      hotfix:
        description: "代码冻结 / 已截止后仍从非 demo-* tag 部署（热修）。勾了要在 decisions 记原因"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 部署排队，不互相取消（半截部署比慢更糟）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check.sh [3] 要算 merge-base

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: 前置检查并生成模块列表
        id: plan
        env:
          MODULE: ${{ inputs.module }}
          ACTOR: ${{ github.actor }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -uo pipefail
          conf() { grep -E "^$1=" hackathon.conf | cut -d= -f2- | sed 's/#.*//' | xargs; }

          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::缺 GitHub Secrets：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。lead 先按 docs/deploy-cloudflare.md 填好再跑。"
            exit 1
          fi

          deployer=$(conf DEPLOYER)
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ -z "$deployer" ] || [ "$(lower "$ACTOR")" != "$(lower "$deployer")" ]; then
            echo "::error::只有 DEPLOYER（hackathon.conf 里的 ${deployer:-未填}）能部署，当前是 $ACTOR。"
            exit 1
          fi

          if [ "$MODULE" = "all" ]; then
            mods=$(conf DEPLOY_MODULES)
            if [ -z "$mods" ]; then
              echo "::error::hackathon.conf 的 DEPLOY_MODULES 是空的：kickoff 后由 lead 填（空格分隔的 apps/ 模块名）。"
              exit 1
            fi
          else
            mods=$MODULE
          fi

          json=""
          for m in $mods; do
            case "$m" in
              ""|.*|*[!A-Za-z0-9._-]*)
                echo "::error::模块名不合法：$m（只允许字母、数字、. _ -）"; exit 1 ;;
            esac
            if [ ! -d "apps/$m" ]; then
              echo "::error::apps/$m 不存在"; exit 1
            fi
            if [ ! -f "apps/$m/wrangler.jsonc" ] && [ ! -f "apps/$m/wrangler.json" ] && [ ! -f "apps/$m/wrangler.toml" ]; then
              echo "::error::apps/$m 里没有 wrangler 配置，不是 Cloudflare 模块（py-tool 类模块不用部署）"; exit 1
            fi
            json="$json${json:+,}\"$m\""
          done
          echo "modules=[$json]" >> "$GITHUB_OUTPUT"
          echo "将部署：$mods"

      - name: 冻结期检查
        env:
          REF: ${{ github.ref }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          phase=$(bash scripts/check.sh --time-raw | grep -E '^PHASE=' | head -n 1 | cut -d= -f2-)
          echo "阶段：${phase:-（读不到）} · ref：$REF · hotfix：$HOTFIX"
          case "$phase" in
            *代码冻结*|*已截止*)
              case "$REF" in
                refs/tags/demo-*) echo "冻结期，从 $REF 部署：允许" ;;
                *)
                  if [ "$HOTFIX" = "true" ]; then
                    echo "::warning::冻结期从 $REF 热修部署（hotfix 已勾选）：记得在 docs/decisions.md 记一条原因。"
                  else
                    echo "::error::现在是「$phase」：只能从 demo-* tag 部署（Run workflow 时在「Use workflow from」里选 tag），确需热修请勾选 hotfix。"
                    exit 1
                  fi ;;
              esac ;;
          esac

      - name: bash scripts/check.sh（全量，有 ❌ 不部署）
        run: bash scripts/check.sh

      - name: 汇总写进 job summary
        if: failure()
        run: |
          if [ -f logs/last-check.txt ] && grep -q '^======== 汇总' logs/last-check.txt; then
            { echo "## ❌ 部署前检查没过"; echo '```'; sed -n '/^======== 汇总/,$p' logs/last-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: deploy ${{ matrix.module }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # 先装模块自己的依赖：wrangler 若在 devDependencies 里，装好后 wrangler-action 会直接用这份
      # （有 package-lock.json 时版本被 lock 精确固定；没有 lock 时按 package.json 的范围取当时最新）。
      # 模块没装 wrangler 时，wrangler-action 会自己装它内置的默认版本 —— 要固定就在下面 with: 里加 wranglerVersion。
      - name: 安装依赖
        working-directory: apps/${{ matrix.module }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-package-lock --no-audit --no-fund
          fi

      - name: wrangler deploy
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.module }}
          command: deploy

      - name: 部署记录写进 job summary
        env:
          MODULE: ${{ matrix.module }}
          URL: ${{ steps.wrangler.outputs.deployment-url }}
          REF: ${{ github.ref_name }}
        run: |
          echo "- ✅ \`$MODULE\` · $REF@${GITHUB_SHA:0:7} · $(date -u '+%Y-%m-%d %H:%M UTC') · ${URL:-（看上一步日志里的 URL）}" >> "$GITHUB_STEP_SUMMARY"
          echo "提醒 lead 更新 docs/3-tasks.md 顶部的「线上版本」。" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: e2e smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: bash scripts/check.sh --e2e DEMO_URL
        run: |
          url=$(grep -E '^DEMO_URL=' hackathon.conf | cut -d= -f2- | sed 's/#.*//' | xargs)
          if [ -z "$url" ]; then
            echo "::warning::hackathon.conf 的 DEMO_URL 为空，跳过线上冒烟。"
            exit 0
          fi
          bash scripts/check.sh --e2e "$url"
