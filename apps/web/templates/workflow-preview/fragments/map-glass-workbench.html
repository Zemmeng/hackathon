  function comparisons(){const keys=Object.keys(options);const rows=[['新增行程','delay','分钟 / 车'],['最大排队','queue','m'],['公交额外用时','transit','分钟 / 班'],['施工期费用','cost','AUD']];const cards=keys.map(k=>{const o=options[k];return '<section class="cw-option '+(state.option===k?'selected':'')+'"><h3>'+o.name+' · '+o.desc+'</h3>'+rows.map(([l,f,u])=>'<div class="cw-row"><span>'+l+'</span><strong>'+(f==='cost'?money(o[f]):o[f])+' '+u+'</strong></div>').join('')+'<div class="cw-row"><span>连续行人通道</span><strong>保留 · 示例</strong></div><button type="button" class="cw-button block '+(state.option===k?'primary':'')+'" data-option="'+k+'">'+(state.option===k?'已选择':'选择此方案')+'</button></section>';}).join('');
    const table='<div class="cw-table-wrap"><table class="cw-table" aria-label="原方案与候选方案比较"><thead><tr><th>评价维度</th>'+keys.map(k=>'<th class="'+(k==='B'?'cw-rec':'')+'"><span class="cw-badge">'+(k==='B'?'综合推荐':k==='A'?'同预算':'比较基准')+'</span><strong>'+options[k].name+'</strong><small>'+options[k].desc+'</small></th>').join('')+'</tr></thead><tbody>'+rows.map(([l,f,u])=>'<tr><td>'+l+'<br><small>'+u+'</small></td>'+keys.map(k=>'<td class="'+(k==='B'?'cw-rec':'')+'"><span class="cw-num">'+(f==='cost'?money(options[k][f]):options[k][f])+'</span></td>').join('')+'</tr>').join('')+'<tr><td>行人通道</td>'+keys.map(k=>'<td class="'+(k==='B'?'cw-rec':'')+'">保留</td>').join('')+'</tr><tr><td>选定方案</td>'+keys.map(k=>'<td class="'+(k==='B'?'cw-rec':'')+'"><button type="button" class="cw-button '+(state.option===k?'primary':'')+'" data-option="'+k+'">'+(state.option===k?'已选择':'选择')+'</button></td>').join('')+'</tr></tbody></table><div class="cw-table-caption">交通：08:00–09:00 · 费用：5 日施工期 · 全部为示例值</div></div>';
    return design.compare==='cards'?'<div>'+cards+'</div>':table+'<div class="cw-mobile-options">'+cards+'</div>';
  }
  function choose(){const o=options[state.option];return '<div class="cw-panel-head"><span class="cw-eyebrow">IMPROVE & COMPARE</span><span class="cw-badge good">候选 B 推荐</span></div><h2>推荐理由与方案差异</h2><div class="cw-box"><h3>候选 B：提前加强上游引导</h3><p class="cw-intro" style="margin-top:7px">增加 1 块 VMS，在路线决策点前显示绕行方向；保持维修任务、施工时段和基本通行约束一致。</p></div><div class="cw-kpis">'+kpi('相对原方案节省','1.7','分钟 / 车')+kpi('施工期增加费用','400','AUD')+'</div><div><h3>需要一起权衡</h3><ul class="cw-list" style="margin-top:8px"><li>A：只调整位置，费用保持 $2,800。</li><li>B：交通改善更明显，费用为 $3,200。</li><li>现场能否布置、供应商报价和绕行承载力仍需核实。</li></ul></div><div class="cw-box"><div class="cw-row"><span>当前选择</span><strong>'+o.name+'</strong></div><div class="cw-row"><span>费用</span><strong>'+money(o.cost)+' AUD</strong></div><p class="cw-small cw-muted" style="margin-top:8px">可选择任何候选方案，选定后在下一步记录理由。</p></div>'+button('返回约束，调整后重新评估','adjust',false,true)+'<details class="cw-details"><summary>结果依据与比较限制</summary><p>推荐与数值均为界面示例，尚未校准或运行真实仿真。实际产品需在相同输入、运行设置与比较口径下评估，并展示误差和不确定性。</p></details>';}
  function report(){const o=options[state.option];return '<article class="cw-paper" aria-label="完整评估报告预览"><div class="cw-paper-top"><strong>RippleTwin</strong><span class="cw-badge">报告预览 · 示例</span></div><span class="cw-eyebrow">LONSDALE STREET / MELBOURNE</span><h2>'+escape(state.projectName)+'影响评估</h2><p class="cw-small cw-muted">'+escape(state.start)+' 至 '+escape(state.end)+' · '+escape(state.from)+'–'+escape(state.to)+' · 方案 v1</p><div class="cw-map-stage">'+map(state.option==='B'?'export':'edit')+'</div><h3>选定：'+o.name+' · '+o.desc+'</h3><div class="cw-diff" style="margin-top:12px"><div><small>新增行程 · 分钟 / 车</small><b>'+o.delay+'</b></div><div><small>最大排队 · m</small><b>'+o.queue+'</b></div><div><small>施工期费用 · AUD</small><b>'+money(o.cost)+'</b></div></div><div class="cw-box"><h3>选定理由</h3><p class="cw-intro" style="margin-top:6px">'+escape(state.reason)+'</p></div><div class="cw-box"><h3>设备与费用 · 示例</h3><div class="cw-report-rows"><div class="cw-row"><span>VMS 信息屏 · '+o.vms+' 块 / 5 日</span><strong>'+money(o.vms*400)+'</strong></div><div class="cw-row"><span>临时标志牌 · 4 块 / 5 日</span><strong>$200</strong></div><div class="cw-row"><span>隔离设施 · 40 件 / 5 日</span><strong>$2,000</strong></div><div class="cw-row"><span>运输与布置</span><strong>$200</strong></div></div></div><details class="cw-details" style="margin-top:14px"><summary>查看数据、假设和实施检查</summary><p>交通、费用与地图均为示例；真实交付需附数据时间范围、运行版本、模型校准、误差、设备清单、交通组织图和人工审阅记录。实际费用应按最终工期重新核算。</p></details><div class="cw-report-foot"><span>附件：方案图 / 对比结果 / 数据依据</span><span>评估摘要 · 示例</span></div></article>';}
  function delivery(){return '<div class="cw-panel-head"><span class="cw-eyebrow">CONFIRM & EXPORT</span><span class="cw-badge amber">待人工复核</span></div><h2>准备评估与交付包</h2><label class="cw-field"><span>所选方案</span><select data-field="option">'+Object.entries(options).map(([k,o])=>'<option value="'+k+'" '+(state.option===k?'selected':'')+'>'+o.name+' · '+o.desc+'</option>').join('')+'</select></label><label class="cw-field"><span>选定理由</span><textarea data-field="reason">'+escape(state.reason)+'</textarea></label><div><h3>导出内容</h3>'+check('评估报告 · PDF：结论、分析、对比与依据','report')+check('设备费用清单 · CSV：数量、工期与单价','inventory')+check('施工布置图：范围、方向、引导点与版本','drawing')+'</div><div class="cw-box"><h3>交付前确认</h3><ul class="cw-list" style="margin-top:9px"><li>报告和当前选定方案版本一致。</li><li>确认交通数据、费用与模型假设。</li><li>完成现场条件与交通组织专业复核。</li></ul></div>'+(state.exported?'<div class="cw-success">'+icon('circle-check')+'导出交互示意已完成。本预览未生成真实交付文件。</div>':'')+'<p class="cw-small cw-muted">系统内部选定用于记录决策；正式审批与实施由相应责任人员完成。</p>';}
  function footer(){const prev=state.step>0?go(icon('arrow-left')+'上一步',state.step-1):'<span class="cw-footer-status">'+icon('map-pinned')+'先选路段，再新建维修方案</span>';let next='';if(state.step===0)next=go('新建维修方案'+icon('arrow-right'),1,true);if(state.step===1)next=go('保存并进入仿真'+icon('arrow-right'),2,true);if(state.step===2)next=go('查看影响分析'+icon('arrow-right'),3,true);if(state.step===3)next=go('生成并比较候选方案'+icon('arrow-right'),4,true);if(state.step===4)next=go('确认方案并准备导出'+icon('arrow-right'),5,true);if(state.step===5)next=button(icon('download')+'导出评估包','export',true);return '<footer class="cw-footer">'+prev+'<span class="cw-footer-status">'+icon('shield-check')+(state.step===0?'地图、指标与费用均为示例':state.step===5?'报告与所选方案保持同一版本':'流程 '+state.step+' / 5 · 输入与当前项目关联')+'</span>'+next+'</footer>';}
  let previousViewKey='';
  function render(){
    const viewKey=[state.step,state.tab,state.analysis,state.panelOpen].join(':');
    const oldScroll=root.querySelector('.cw-window-body')?.scrollTop||0;
    root.style.colorScheme=state.theme;root.dataset.step=String(state.step);root.dataset.panel=design.panel;
    const mode=state.step===0?'home':state.step===1?'edit':state.step===3?'sim':state.step>=4?(state.option==='B'?'guided':'sim'):(state.replay==='B'?'guided':'sim');
    const weather=[['clear','sun','晴天'],['rain','cloud-rain','降雨'],['fog','haze','雾天']];
    const controls='<div class="cw-map-hud"><div class="cw-pills" aria-label="天气场景">'+weather.map(([v,i,l])=>'<button type="button" data-weather="'+v+'" aria-pressed="'+(state.weather===v)+'">'+icon(i)+l+'</button>').join('')+'</div><div class="cw-pills" aria-label="底图模式"><button type="button" data-basemap="streets" aria-pressed="'+(state.basemap==='streets')+'">街道</button><button type="button" data-basemap="buildings" aria-pressed="'+(state.basemap==='buildings')+'">建筑</button></div></div><div class="cw-rail" aria-label="地图图层"><button type="button" data-action="works-layer" aria-label="施工图层" aria-pressed="'+state.worksLayer+'">'+icon('triangle-alert')+'</button><button type="button" data-action="flow-layer" aria-label="交通影响图层" aria-pressed="'+state.flowLayer+'">'+icon('route')+'</button><button type="button" data-action="map-home" aria-label="回到施工区域">'+icon('locate-fixed')+'</button></div>';
    let content='<div class="cw-panel-content">'+[overview,configuration,simulation,analysis,choose,delivery][state.step]()+'</div>';
    if(state.step===4)content='<div class="cw-decision-layout"><div class="cw-decision-material"><h2>三套方案 · 完整对比</h2>'+comparisons()+'</div>'+content+'</div>';
    if(state.step===5)content='<div class="cw-decision-layout"><div class="cw-decision-material">'+report()+'</div>'+content+'</div>';
    shell.innerHTML='<div class="cw-app"><div class="cw-map-backdrop" aria-label="全屏地图仿真底板">'+map(mode)+'</div><header class="cw-top cw-glass"><button type="button" class="cw-brand" data-go="0" aria-label="RippleTwin 工作台"><span>'+icon('radar')+'</span>RippleTwin</button><div class="cw-scene"><span>SCENE</span><strong>Lonsdale St · 西行 · Melbourne CBD</strong></div><div class="cw-top-end"><span class="cw-badge">示例仿真场景</span><button type="button" class="cw-theme" data-action="theme" aria-label="切换明暗主题">'+icon(state.theme==='dark'?'sun':'moon')+'</button></div></header><nav class="cw-steps cw-glass" aria-label="完整施工规划流程">'+steps.map((s,i)=>'<button type="button" class="cw-step" data-go="'+i+'" '+(state.step===i?'aria-current="step"':'')+'><span>'+String(i).padStart(2,'0')+'</span>'+s+'</button>').join('')+'</nav>'+controls+'<div class="cw-map-label cw-glass"><strong>Lonsdale St · 西行施工区</strong><small>Melbourne CBD · 08:00–09:00 · 示例</small></div>'+(state.step===2?'<div class="cw-map-timeline">'+timeline()+'</div>':'')+(state.panelOpen?'<section class="cw-floating-window cw-glass" role="region" aria-label="'+steps[state.step]+'悬浮工作台"><header class="cw-window-title">'+icon('panels-top-left')+'<h1>'+steps[state.step]+'<small>工作台 · '+String(state.step+1).padStart(2,'0')+' / 06</small></h1><button type="button" class="cw-window-control" data-action="toggle-panel" aria-label="收起工作台">'+icon('minus')+'</button></header><div class="cw-window-body">'+content+'</div>'+footer()+'</section>':'<div class="cw-reopen">'+button(icon('panels-top-left')+'打开'+steps[state.step]+'工作台','toggle-panel',true)+'</div>')+'</div>';
    root.querySelectorAll('.rt-map-geometry').forEach(el=>{el.style.filter=state.weather==='fog'?'contrast(.65)':state.weather==='rain'?'saturate(.7)':'none';});
    root.querySelectorAll('.rt-block,.rt-landmark').forEach(el=>{el.style.opacity=state.basemap==='buildings'?'1':'.65';});
    root.querySelectorAll('.rt-workline,.rt-workcaps,.rt-map-pin,.rt-map-pill.works').forEach(el=>{el.style.visibility=state.worksLayer?'visible':'hidden';});
    root.querySelectorAll('.rt-queue,.rt-route,.rt-trafficline,.rt-map-pill.queue,.rt-map-pill.detour').forEach(el=>{el.style.visibility=state.flowLayer?'visible':'hidden';});
    const body=root.querySelector('.cw-window-body');
    if(body&&previousViewKey===viewKey)body.scrollTop=oldScroll;
    previousViewKey=viewKey;
    icons();
  }
  function notice(text){const el=root.querySelector('#cw-toast');el.innerHTML='<span>'+escape(text)+'</span>'+button('知道了','dismiss');el.hidden=false;}
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b))return;
    if(b.dataset.go!==undefined){state.step=Number(b.dataset.go);state.panelOpen=true;root.querySelector('#cw-toast').hidden=true;render();save();return;}
    if(b.dataset.tab){state.tab=b.dataset.tab;render();save();return;}
    if(b.dataset.analysis){state.analysis=b.dataset.analysis;render();save();return;}
    if(b.dataset.option){state.option=b.dataset.option;state.reason='结合交通影响与设备投入，选用'+options[state.option].name+'。';state.exported=false;render();save();return;}
    if(b.dataset.weather){state.weather=b.dataset.weather;render();save();return;}
    if(b.dataset.basemap){state.basemap=b.dataset.basemap;render();save();return;}
    if(b.dataset.replay){state.replay=b.dataset.replay;render();save();return;}
    const a=b.dataset.action;
    if(a==='toggle-panel')state.panelOpen=!state.panelOpen;
    if(a==='theme')state.theme=state.theme==='dark'?'light':'dark';
    if(a==='equipment'||a==='constraints')state.tab=a;
    if(a==='run')state.ran=true;
    if(a==='adjust'){state.step=1;state.tab='constraints';}
    if(a==='next-frame')state.minute=(state.minute+5)%60;
    if(a==='works-layer')state.worksLayer=!state.worksLayer;
    if(a==='flow-layer')state.flowLayer=!state.flowLayer;
    if(a==='zoom-in')state.zoom=Math.min(1.5,state.zoom+.1);
    if(a==='zoom-out')state.zoom=Math.max(1,state.zoom-.1);
    if(a==='map-home')state.zoom=1;
    if(a==='export'){if(!state.report&&!state.inventory&&!state.drawing){notice('请至少选择一项导出内容。');return;}state.exported=true;}
    if(a==='dismiss'){root.querySelector('#cw-toast').hidden=true;return;}
    render();save();
  });
  root.addEventListener('change',event=>{const e=event.target;const key=e.dataset.field;if(!key)return;if(!(key in defaults))return;state[key]=e.type==='checkbox'?e.checked:e.type==='range'?Number(e.value):e.value;if(key==='option'){state.reason='结合交通影响与设备投入，选用'+options[state.option].name+'。';state.exported=false;}render();save();});
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved){restore(saved);render();}});
  render();
  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(design,'panel',{label:'操作面板位置',options:[{label:'地图左侧 · 面板右侧',value:'right'},{label:'面板左侧 · 地图右侧',value:'left'}]});tweak.addSelect(design,'compare',{label:'完整方案比较',options:[{label:'并排对比表',value:'table'},{label:'逐套完整卡片',value:'cards'}]});}
})();
</script>
