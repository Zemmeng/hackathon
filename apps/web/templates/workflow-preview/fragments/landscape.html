<script>

  }
  function heading(title,subtitle,status='') {return '<div class="rt-page-heading"><div><h1>'+title+'</h1><p>'+subtitle+'</p></div>'+status+'</div>';}

    const rows=[['平均新增行程','delay',' 分钟 / 车'],['最大排队长度','queue',' m'],['公交额外用时','transit',' 分钟 / 班']];
    rows.forEach(row=>{table+='<tr><td>'+row[0]+'</td>'+Object.entries(options).map(([key,o])=>'<td class="'+(key==='B'?'rt-recommended-col':'')+'"><span class="rt-numeric">'+o[row[1]]+'</span><small>'+row[2]+'</small></td>').join('')+'</tr>';});
    table+='<tr><td>连续行人通道</td>'+Object.keys(options).map(key=>'<td class="'+(key==='B'?'rt-recommended-col':'')+'">'+icon('check')+'保留</td>').join('')+'</tr><tr><td>施工期费用 <small>· AUD</small></td>'+Object.entries(options).map(([key,o])=>'<td class="'+(key==='B'?'rt-recommended-col':'')+'"><span class="rt-numeric">'+money(o.cost)+'</span></td>').join('')+'</tr><tr><td>方案选择</td>'+Object.keys(options).map(key=>'<td class="'+(key==='B'?'rt-recommended-col':'')+'"><button type="button" class="rt-button '+(state.selected===key?'primary':'')+'" data-select="'+key+'">'+(state.selected===key?icon('check')+'已选择':'选择这套')+'</button></td>').join('')+'</tr></tbody></table><div class="rt-comparison-foot">交通：08:00–09:00 · 费用：5 日施工期 · 所有指标与价格均为占位示例</div></div>';
    return heading('比较并选择方案','同一维修任务，清楚比较每一种收益与代价。','<span class="rt-status">2 套候选</span>')+'<section class="rt-recommendation"><div><div class="rt-recommendation-title">'+icon('sparkles')+'推荐方案 B · 加强上游引导</div><p>新增 1 块 VMS，保留公交与连续行人通道。</p></div><div class="rt-recommendation-number">−1.7<small>分钟 / 车，相比原方案</small></div></section>'+(design.compareView==='cards'?optionCards():table+'<div class="rt-mobile-compare">'+optionCards()+'</div>')+'<div class="rt-explanation"><section class="rt-panel"><h3>方案 B 具体改变了什么</h3><ul class="rt-change-list"><li>'+icon('check')+'在路线决策点前增加 1 块 VMS</li><li>'+icon('check')+'明确显示绕行方向与道路名称</li><li>'+icon('check')+'施工时段与维修任务保持一致</li></ul></section><section class="rt-panel"><h3>需要接受的代价</h3><div class="rt-cost-trade"><strong>+$400</strong><span class="rt-muted">施工期设备费用<br>仍低于示例预算 $3,500</span></div><p class="rt-small rt-muted" style="margin-top:11px">建议结合现场安装条件与供应商报价复核。</p></section></div><details class="rt-evidence"><summary>查看结果依据与假设</summary><p>本页只展示结果页面的布局。数值、预算、通行状态和推荐理由均为占位示例，不代表实际仿真、报价或工程审查。</p></details><div class="rt-bottom-actions">'+button(icon('arrow-left')+'查看仿真',2)+'<span class="rt-small rt-muted">已选：'+selected.name+'</span>'+button('确认并准备导出',4,true)+'</div>';
  }
  function exportPage() {
    const selected=options[state.selected];
    return heading('确认方案与导出','让评估结果成为可以交接、审阅的项目材料。','<span class="rt-status warn">待人工复核</span>')+'<div class="rt-export-grid"><div class="rt-paper-wrap"><article class="rt-paper" aria-label="评估报告预览"><div class="rt-paper-brand"><strong>RippleTwin</strong><span>评估与实施建议包</span></div><span class="rt-eyebrow">LONSDALE STREET · MELBOURNE</span><h2>道路养护施工影响评估</h2><p class="rt-small rt-muted">2026.10.05–10.09 · 西行 · 方案 v1 · 示意报告</p>'+map(state.selected==='B'?'export':'edit',true)+'<div class="rt-section-title"><h3>所选：'+selected.name+' · '+selected.description+'</h3></div><div class="rt-paper-stats"><div><span>新增行程 · 分钟 / 车</span><strong>'+selected.delay+'</strong></div><div><span>最大排队 · m</span><strong>'+selected.queue+'</strong></div><div><span>施工期费用 · AUD</span><strong>'+money(selected.cost)+'</strong></div></div><h3 style="margin-top:16px">设备与费用清单 · 示例</h3><table class="rt-paper-table" aria-label="示例设备费用清单"><tbody><tr><td>VMS 信息屏</td><td>'+selected.vms+' 块 / 5 日</td><td>'+money(selected.vms*400)+'</td></tr><tr><td>临时标志牌</td><td>4 块 / 5 日</td><td>$200</td></tr><tr><td>隔离设施</td><td>40 件 / 5 日</td><td>$2,000</td></tr><tr><td>运输与布置</td><td>示例费用</td><td>$200</td></tr></tbody></table><div class="rt-paper-foot"><span>附：方案图、对比结果、数据与假设</span><span>1 / 3</span></div></article></div><div class="rt-export-side"><section class="rt-panel"><h2>准备交付</h2><label class="rt-field" style="margin-top:18px"><span>所选方案</span><select data-field="selected" aria-label="所选方案">'+Object.entries(options).map(([key,o])=>'<option value="'+key+'" '+(state.selected===key?'selected':'')+'>'+o.name+' · '+o.description+'</option>').join('')+'</select></label><label class="rt-field"><span>选定理由</span><textarea data-field="reason">'+escape(state.reason)+'</textarea></label><h3>导出内容</h3><div class="rt-export-list"><label class="rt-check"><input type="checkbox" checked><span>评估报告<small>PDF · 摘要、方案与依据</small></span></label><label class="rt-check"><input type="checkbox" checked><span>设备与费用清单<small>CSV · 便于询价与交接</small></span></label><label class="rt-check"><input type="checkbox" checked><span>施工布置图<small>含图例、方向与版本</small></span></label></div><button type="button" class="rt-button primary block" data-action="export">'+icon('download')+'导出评估包</button>'+(state.exported?'<div class="rt-export-confirm">'+icon('circle-check')+'导出步骤示意已完成。预览中未生成实际文件。</div>':'')+'<p class="rt-small rt-muted" style="margin-top:12px">内部选定不代表正式审批，实际实施前完成专业复核。</p></section></div></div><div class="rt-bottom-actions">'+button(icon('arrow-left')+'返回比较',3)+'<span class="rt-small rt-muted">报告与所选方案保持同一版本</span></div>';
  }
  function render() {
    root.dataset.formSide=design.formSide;
    root.dataset.view=String(state.view);
    root.style.setProperty('--rt-pad',design.density==='compact'?'12px':'16px');
    root.querySelectorAll('.rt-flow [data-go]').forEach(el=>{const step=Number(el.dataset.go);el.classList.toggle('rt-done',step<state.view);if(step===state.view)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
    root.querySelectorAll('[data-nav]').forEach(el=>{if((el.dataset.nav==='home')===(state.view===0))el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
    page.innerHTML=[home,configure,simulation,compare,exportPage][state.view]();
    icons();
  }
  function notice(message) {
    const element=root.querySelector('#rt-notice');
    element.innerHTML='<span>'+escape(message)+'</span><button type="button" data-action="dismiss">知道了</button>';
    element.hidden=false;
  }
  root.addEventListener('click',event=>{
    const target=event.target.closest('button');
    if(!target||!root.contains(target))return;
    if(target.dataset.go!==undefined){state.view=Number(target.dataset.go);root.querySelector('#rt-notice').hidden=true;render();root.querySelector(".rt-flow").scrollIntoView({block:"start",behavior:"instant"});persist();return;}
    if(target.dataset.formTab){state.formTab=target.dataset.formTab;render();persist();return;}
    if(target.dataset.select){state.selected=target.dataset.select;state.reason='结合交通影响与设备投入，选用'+options[state.selected].name+'。';state.exported=false;render();persist();return;}
    if(target.dataset.replay){state.replay=target.dataset.replay;render();persist();return;}
    const action=target.dataset.action;
    if(action==='zoom-in'||action==='zoom-out'){state.zoom=Math.max(1,Math.min(1.5,state.zoom+(action==='zoom-in' ? 0.1 : -0.1)));root.querySelectorAll('.rt-map-geometry').forEach(el=>el.style.transform='scale('+state.zoom+')');persist();}
    if(action==='next-frame'){state.minute=state.minute>=59?0:Math.min(59,state.minute+5);render();persist();}
    if(action==='export'){state.exported=true;render();persist();}
    if(action==='dismiss')root.querySelector('#rt-notice').hidden=true;
  });
  root.addEventListener('change',event=>{
    const input=event.target;
    const field=input.dataset.field;
    if(!field)return;
    if(field==='goal'){notice('目标选择已演示；示意数值不会随输入重新计算。');return;}
    if(!(field in defaults))return;
    state[field]=input.type==='checkbox'?input.checked:input.type==='range'?Number(input.value):input.value;
    if(field==='selected'){state.reason='结合交通影响与设备投入，选用'+options[state.selected].name+'。';state.exported=false;}
    render();persist();
  });
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved){restore(saved);render();}});
  render();
  if(globalThis.Tweak){
    const tweak=new globalThis.Tweak({container:root,onChange:()=>{render();persist();}});
    tweak.addSelect(design,'formSide',{label:'配置页的表单位置',options:[{label:'地图左侧 · 表单右侧',value:'right'},{label:'表单左侧 · 地图右侧',value:'left'}]});
    tweak.addSelect(design,'compareView',{label:'方案比较方式',options:[{label:'并排对比表',value:'table'},{label:'独立方案卡片',value:'cards'}]});
    tweak.addSelect(design,'density',{label:'面板信息密度',options:[{label:'舒展',value:'comfortable'},{label:'紧凑',value:'compact'}]});
  }
})();
</script>
