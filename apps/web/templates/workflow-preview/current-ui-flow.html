:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {

  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;

}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {

  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);

}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;

}

.btn:is(.btn-block, .viz-tile) {

}

  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;

.btn:not(:disabled):hover,

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);

.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px

  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {

  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);

  user-select: none;

.viz-carousel-picker &gt; summary {

  min-height: 30px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 6px;
  -webkit-app-region: no-drag;
  border: 0;
  border-radius: 14px;
  color: inherit;
  background: transparent;
  font: inherit;
  -webkit-tap-highlight-color: transparent;

.viz-carousel-picker &gt; summary {

}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px;
  padding: 0;
}

.viz-carousel-picker &gt; summary {

}

.viz-carousel-controls .viz-carousel-caret {

  function simulation(){const o=options[state.replay];return &#x27;&lt;div class=&quot;cw-panel-head&quot;&gt;&lt;span class=&quot;cw-eyebrow&quot;&gt;JUNCTION SIMULATION&lt;/span&gt;&lt;span class=&quot;cw-badge &#x27;+(state.ran?&#x27;good&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+(state.ran?&#x27;完成状态示意&#x27;:&#x27;待评估&#x27;)+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;先运行，再查看影响&lt;/h2&gt;&lt;p class=&quot;cw-intro&quot;&gt;保留现有路口回放与时间轴，运行状态、情景范围和结果入口集中在右侧。&lt;/p&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;本次评价范围&lt;/h3&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;交通时段&lt;/span&gt;&lt;strong&gt;08:00–09:00&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;交通需求&lt;/span&gt;&lt;strong&gt;同一组示例输入&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;情景&lt;/span&gt;&lt;strong&gt;无施工 / 原方案 / A / B&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;天气条件&lt;/span&gt;&lt;strong&gt;&#x27;+({clear:&#x27;晴天&#x27;,rain:&#x27;降雨&#x27;,fog:&#x27;雾天&#x27;}[state.weather]||&#x27;晴天&#x27;)+&#x27; · 示例&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+button(state.ran?&#x27;重新演示评估&#x27;:&#x27;开始仿真（示意）&#x27;,&#x27;run&#x27;,true,true)+(state.ran?&#x27;&lt;div class=&quot;cw-success&quot;&gt;&#x27;+icon(&#x27;circle-check&#x27;)+&#x27;4 / 4 情景 · 完成状态示意，未调用真实交通模型。&lt;/div&gt;&#x27;:&#x27;&lt;p class=&quot;cw-small cw-muted&quot;&gt;点击后展示完成状态与示例结果；不会连接服务器。&lt;/p&gt;&#x27;)+&#x27;&lt;div class=&quot;cw-pills&quot; aria-label=&quot;回放方案&quot;&gt;&lt;button type=&quot;button&quot; data-replay=&quot;original&quot; aria-pressed=&quot;&#x27;+(state.replay===&#x27;original&#x27;)+&#x27;&quot;&gt;原方案&lt;/button&gt;&lt;button type=&quot;button&quot; data-replay=&quot;B&quot; aria-pressed=&quot;&#x27;+(state.replay===&#x27;B&#x27;)+&#x27;&quot;&gt;候选 B&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;cw-kpis&quot;&gt;&#x27;+kpi(&#x27;平均新增行程&#x27;,o.delay,&#x27;分钟 / 车&#x27;)+kpi(&#x27;最大排队&#x27;,o.queue,&#x27;m&#x27;)+&#x27;&lt;/div&gt;&lt;details class=&quot;cw-details&quot;&gt;&lt;summary&gt;查看运行记录与参数&lt;/summary&gt;&lt;p&gt;路网检查 → 需求与信号检查 → 多情景计算 → 指标汇总。此处为状态与记录的布局示意，真实版本应保留每次运行的参数、版本和失败原因。&lt;/p&gt;&lt;/details&gt;&#x27;;}
  function analysis(){let content=&#x27;&#x27;;if(state.analysis===&#x27;traffic&#x27;)content=&#x27;&lt;div class=&quot;cw-kpis&quot;&gt;&#x27;+kpi(&#x27;原方案新增行程&#x27;,&#x27;3.8&#x27;,&#x27;分钟 / 车&#x27;)+kpi(&#x27;最大排队&#x27;,&#x27;680&#x27;,&#x27;m&#x27;)+kpi(&#x27;公交额外用时&#x27;,&#x27;2.9&#x27;,&#x27;分钟 / 班&#x27;)+kpi(&#x27;行人通道&#x27;,&#x27;保留&#x27;,&#x27;需现场核验&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;主要影响 · 示例&lt;/h3&gt;&lt;ul class=&quot;cw-list&quot; style=&quot;margin-top:9px&quot;&gt;&lt;li&gt;排队向上游路口延伸，影响相邻道路进入施工区。&lt;/li&gt;&lt;li&gt;公交与一般车辆共用剩余通行空间。&lt;/li&gt;&lt;li&gt;行人连续通道仍需核实现场宽度与安全隔离。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;&#x27;+icon(&#x27;sparkles&#x27;)+&#x27; 分析解释与优化方向&lt;/h3&gt;&lt;p class=&quot;cw-intro&quot; style=&quot;margin-top:7px&quot;&gt;更早告知施工并在路线决策点前引导分流，是两套候选方案的主要差别。推荐必须同时说明改善幅度、成本与约束。&lt;/p&gt;&lt;/div&gt;&#x27;;
    if(state.analysis===&#x27;overlap&#x27;)content=&#x27;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;施工叠加检查 · 示例&lt;/h3&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;本项目&lt;/span&gt;&lt;strong&gt;Lonsdale St&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;邻近项目&lt;/span&gt;&lt;strong&gt;La Trobe St&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;时间窗口&lt;/span&gt;&lt;strong&gt;08:00–09:00&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;cw-callout&quot;&gt;同一条绕行路可能同时承接两个项目的流量，需要检查是否把拥堵转移到邻近路段。&lt;/p&gt;&lt;ul class=&quot;cw-list&quot;&gt;&lt;li&gt;比较独立施工与同时施工的网络影响。&lt;/li&gt;&lt;li&gt;核对绕行路线与设备资源是否冲突。&lt;/li&gt;&lt;li&gt;候选措施可包含错峰、调整位置或补充引导。&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;cw-small cw-muted&quot;&gt;项目、时段与风险均为展示示例，尚未接入真实施工记录。&lt;/p&gt;&#x27;;
    if(state.analysis===&#x27;evidence&#x27;)content=&#x27;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;结果可追溯信息&lt;/h3&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;路网&lt;/span&gt;&lt;strong&gt;示意地图&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;流量 / 信号&lt;/span&gt;&lt;strong&gt;占位输入&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;设备费用&lt;/span&gt;&lt;strong&gt;示例单价&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;模型与校准&lt;/span&gt;&lt;strong&gt;未接入&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;指标口径&lt;/h3&gt;&lt;p class=&quot;cw-intro&quot; style=&quot;margin-top:7px&quot;&gt;交通指标比较同一小时；费用覆盖完整 5 日施工期。新增行程相对无施工基准，改善幅度相对原方案。&lt;/p&gt;&lt;/div&gt;&lt;ul class=&quot;cw-list&quot;&gt;&lt;li&gt;真实版本应记录数据日期、覆盖范围与估算比例。&lt;/li&gt;&lt;li&gt;报告需列出模型假设、校准结果及误差。&lt;/li&gt;&lt;li&gt;不把语言模型的解释当作仿真证据。&lt;/li&gt;&lt;/ul&gt;&#x27;;
    return &#x27;&lt;div class=&quot;cw-panel-head&quot;&gt;&lt;span class=&quot;cw-eyebrow&quot;&gt;NETWORK IMPACT&lt;/span&gt;&lt;span class=&quot;cw-badge&quot;&gt;示例评估&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;哪里受影响，为什么&lt;/h2&gt;&#x27;+tabs([[&#x27;traffic&#x27;,&#x27;交通影响&#x27;],[&#x27;overlap&#x27;,&#x27;施工叠加&#x27;],[&#x27;evidence&#x27;,&#x27;依据假设&#x27;]],state.analysis,&#x27;analysis&#x27;)+&#x27;&lt;div class=&quot;cw-stack&quot; role=&quot;tabpanel&quot; id=&quot;cw-analysis-panel&quot; aria-labelledby=&quot;cw-analysis-&#x27;+state.analysis+&#x27;&quot;&gt;&#x27;+content+&#x27;&lt;/div&gt;&#x27;;
  }
  function comparisons(){const keys=Object.keys(options);const rows=[[&#x27;新增行程&#x27;,&#x27;delay&#x27;,&#x27;分钟 / 车&#x27;],[&#x27;最大排队&#x27;,&#x27;queue&#x27;,&#x27;m&#x27;],[&#x27;公交额外用时&#x27;,&#x27;transit&#x27;,&#x27;分钟 / 班&#x27;],[&#x27;施工期费用&#x27;,&#x27;cost&#x27;,&#x27;AUD&#x27;]];const cards=keys.map(k=&gt;{const o=options[k];return &#x27;&lt;section class=&quot;cw-option &#x27;+(state.option===k?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;h3&gt;&#x27;+o.name+&#x27; · &#x27;+o.desc+&#x27;&lt;/h3&gt;&#x27;+rows.map(([l,f,u])=&gt;&#x27;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;&#x27;+l+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+(f===&#x27;cost&#x27;?money(o[f]):o[f])+&#x27; &#x27;+u+&#x27;&lt;/strong&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;连续行人通道&lt;/span&gt;&lt;strong&gt;保留 · 示例&lt;/strong&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;cw-button block &#x27;+(state.option===k?&#x27;primary&#x27;:&#x27;&#x27;)+&#x27;&quot; data-option=&quot;&#x27;+k+&#x27;&quot;&gt;&#x27;+(state.option===k?&#x27;已选择&#x27;:&#x27;选择此方案&#x27;)+&#x27;&lt;/button&gt;&lt;/section&gt;&#x27;;}).join(&#x27;&#x27;);
    const table=&#x27;&lt;div class=&quot;cw-table-wrap&quot;&gt;&lt;table class=&quot;cw-table&quot; aria-label=&quot;原方案与候选方案比较&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;评价维度&lt;/th&gt;&#x27;+keys.map(k=&gt;&#x27;&lt;th class=&quot;&#x27;+(k===&#x27;B&#x27;?&#x27;cw-rec&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;span class=&quot;cw-badge&quot;&gt;&#x27;+(k===&#x27;B&#x27;?&#x27;综合推荐&#x27;:k===&#x27;A&#x27;?&#x27;同预算&#x27;:&#x27;比较基准&#x27;)+&#x27;&lt;/span&gt;&lt;strong&gt;&#x27;+options[k].name+&#x27;&lt;/strong&gt;&lt;small&gt;&#x27;+options[k].desc+&#x27;&lt;/small&gt;&lt;/th&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;+rows.map(([l,f,u])=&gt;&#x27;&lt;tr&gt;&lt;td&gt;&#x27;+l+&#x27;&lt;br&gt;&lt;small&gt;&#x27;+u+&#x27;&lt;/small&gt;&lt;/td&gt;&#x27;+keys.map(k=&gt;&#x27;&lt;td class=&quot;&#x27;+(k===&#x27;B&#x27;?&#x27;cw-rec&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;span class=&quot;cw-num&quot;&gt;&#x27;+(f===&#x27;cost&#x27;?money(options[k][f]):options[k][f])+&#x27;&lt;/span&gt;&lt;/td&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;tr&gt;&lt;td&gt;行人通道&lt;/td&gt;&#x27;+keys.map(k=&gt;&#x27;&lt;td class=&quot;&#x27;+(k===&#x27;B&#x27;?&#x27;cw-rec&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;保留&lt;/td&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;选定方案&lt;/td&gt;&#x27;+keys.map(k=&gt;&#x27;&lt;td class=&quot;&#x27;+(k===&#x27;B&#x27;?&#x27;cw-rec&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cw-button &#x27;+(state.option===k?&#x27;primary&#x27;:&#x27;&#x27;)+&#x27;&quot; data-option=&quot;&#x27;+k+&#x27;&quot;&gt;&#x27;+(state.option===k?&#x27;已选择&#x27;:&#x27;选择&#x27;)+&#x27;&lt;/button&gt;&lt;/td&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;cw-table-caption&quot;&gt;交通：08:00–09:00 · 费用：5 日施工期 · 全部为示例值&lt;/div&gt;&lt;/div&gt;&#x27;;
    return design.compare===&#x27;cards&#x27;?&#x27;&lt;div&gt;&#x27;+cards+&#x27;&lt;/div&gt;&#x27;:table+&#x27;&lt;div class=&quot;cw-mobile-options&quot;&gt;&#x27;+cards+&#x27;&lt;/div&gt;&#x27;;
  }
  function choose(){const o=options[state.option];return &#x27;&lt;div class=&quot;cw-panel-head&quot;&gt;&lt;span class=&quot;cw-eyebrow&quot;&gt;IMPROVE &amp; COMPARE&lt;/span&gt;&lt;span class=&quot;cw-badge good&quot;&gt;候选 B 推荐&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;推荐理由与方案差异&lt;/h2&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;候选 B：提前加强上游引导&lt;/h3&gt;&lt;p class=&quot;cw-intro&quot; style=&quot;margin-top:7px&quot;&gt;增加 1 块 VMS，在路线决策点前显示绕行方向；保持维修任务、施工时段和基本通行约束一致。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;cw-kpis&quot;&gt;&#x27;+kpi(&#x27;相对原方案节省&#x27;,&#x27;1.7&#x27;,&#x27;分钟 / 车&#x27;)+kpi(&#x27;施工期增加费用&#x27;,&#x27;400&#x27;,&#x27;AUD&#x27;)+&#x27;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;需要一起权衡&lt;/h3&gt;&lt;ul class=&quot;cw-list&quot; style=&quot;margin-top:8px&quot;&gt;&lt;li&gt;A：只调整位置，费用保持 $2,800。&lt;/li&gt;&lt;li&gt;B：交通改善更明显，费用为 $3,200。&lt;/li&gt;&lt;li&gt;现场能否布置、供应商报价和绕行承载力仍需核实。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;当前选择&lt;/span&gt;&lt;strong&gt;&#x27;+o.name+&#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;费用&lt;/span&gt;&lt;strong&gt;&#x27;+money(o.cost)+&#x27; AUD&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;cw-small cw-muted&quot; style=&quot;margin-top:8px&quot;&gt;可选择任何候选方案，选定后在下一步记录理由。&lt;/p&gt;&lt;/div&gt;&#x27;+button(&#x27;返回约束，调整后重新评估&#x27;,&#x27;adjust&#x27;,false,true)+&#x27;&lt;details class=&quot;cw-details&quot;&gt;&lt;summary&gt;结果依据与比较限制&lt;/summary&gt;&lt;p&gt;推荐与数值均为界面示例，尚未校准或运行真实仿真。实际产品需在相同输入、运行设置与比较口径下评估，并展示误差和不确定性。&lt;/p&gt;&lt;/details&gt;&#x27;;}
  function report(){const o=options[state.option];return &#x27;&lt;article class=&quot;cw-paper&quot; aria-label=&quot;完整评估报告预览&quot;&gt;&lt;div class=&quot;cw-paper-top&quot;&gt;&lt;strong&gt;RippleTwin&lt;/strong&gt;&lt;span class=&quot;cw-badge&quot;&gt;报告预览 · 示例&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;cw-eyebrow&quot;&gt;LONSDALE STREET / MELBOURNE&lt;/span&gt;&lt;h2&gt;&#x27;+escape(state.projectName)+&#x27;影响评估&lt;/h2&gt;&lt;p class=&quot;cw-small cw-muted&quot;&gt;&#x27;+escape(state.start)+&#x27; 至 &#x27;+escape(state.end)+&#x27; · &#x27;+escape(state.from)+&#x27;–&#x27;+escape(state.to)+&#x27; · 方案 v1&lt;/p&gt;&lt;div class=&quot;cw-map-stage&quot;&gt;&#x27;+map(state.option===&#x27;B&#x27;?&#x27;export&#x27;:&#x27;edit&#x27;)+&#x27;&lt;/div&gt;&lt;h3&gt;选定：&#x27;+o.name+&#x27; · &#x27;+o.desc+&#x27;&lt;/h3&gt;&lt;div class=&quot;cw-diff&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div&gt;&lt;small&gt;新增行程 · 分钟 / 车&lt;/small&gt;&lt;b&gt;&#x27;+o.delay+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;最大排队 · m&lt;/small&gt;&lt;b&gt;&#x27;+o.queue+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;施工期费用 · AUD&lt;/small&gt;&lt;b&gt;&#x27;+money(o.cost)+&#x27;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;选定理由&lt;/h3&gt;&lt;p class=&quot;cw-intro&quot; style=&quot;margin-top:6px&quot;&gt;&#x27;+escape(state.reason)+&#x27;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;设备与费用 · 示例&lt;/h3&gt;&lt;div class=&quot;cw-report-rows&quot;&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;VMS 信息屏 · &#x27;+o.vms+&#x27; 块 / 5 日&lt;/span&gt;&lt;strong&gt;&#x27;+money(o.vms*400)+&#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;临时标志牌 · 4 块 / 5 日&lt;/span&gt;&lt;strong&gt;$200&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;隔离设施 · 40 件 / 5 日&lt;/span&gt;&lt;strong&gt;$2,000&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;cw-row&quot;&gt;&lt;span&gt;运输与布置&lt;/span&gt;&lt;strong&gt;$200&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;cw-details&quot; style=&quot;margin-top:14px&quot;&gt;&lt;summary&gt;查看数据、假设和实施检查&lt;/summary&gt;&lt;p&gt;交通、费用与地图均为示例；真实交付需附数据时间范围、运行版本、模型校准、误差、设备清单、交通组织图和人工审阅记录。实际费用应按最终工期重新核算。&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;cw-report-foot&quot;&gt;&lt;span&gt;附件：方案图 / 对比结果 / 数据依据&lt;/span&gt;&lt;span&gt;评估摘要 · 示例&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&#x27;;}
  function delivery(){return &#x27;&lt;div class=&quot;cw-panel-head&quot;&gt;&lt;span class=&quot;cw-eyebrow&quot;&gt;CONFIRM &amp; EXPORT&lt;/span&gt;&lt;span class=&quot;cw-badge amber&quot;&gt;待人工复核&lt;/span&gt;&lt;/div&gt;&lt;h2&gt;准备评估与交付包&lt;/h2&gt;&lt;label class=&quot;cw-field&quot;&gt;&lt;span&gt;所选方案&lt;/span&gt;&lt;select data-field=&quot;option&quot;&gt;&#x27;+Object.entries(options).map(([k,o])=&gt;&#x27;&lt;option value=&quot;&#x27;+k+&#x27;&quot; &#x27;+(state.option===k?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+o.name+&#x27; · &#x27;+o.desc+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;cw-field&quot;&gt;&lt;span&gt;选定理由&lt;/span&gt;&lt;textarea data-field=&quot;reason&quot;&gt;&#x27;+escape(state.reason)+&#x27;&lt;/textarea&gt;&lt;/label&gt;&lt;div&gt;&lt;h3&gt;导出内容&lt;/h3&gt;&#x27;+check(&#x27;评估报告 · PDF：结论、分析、对比与依据&#x27;,&#x27;report&#x27;)+check(&#x27;设备费用清单 · CSV：数量、工期与单价&#x27;,&#x27;inventory&#x27;)+check(&#x27;施工布置图：范围、方向、引导点与版本&#x27;,&#x27;drawing&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;cw-box&quot;&gt;&lt;h3&gt;交付前确认&lt;/h3&gt;&lt;ul class=&quot;cw-list&quot; style=&quot;margin-top:9px&quot;&gt;&lt;li&gt;报告和当前选定方案版本一致。&lt;/li&gt;&lt;li&gt;确认交通数据、费用与模型假设。&lt;/li&gt;&lt;li&gt;完成现场条件与交通组织专业复核。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&#x27;+(state.exported?&#x27;&lt;div class=&quot;cw-success&quot;&gt;&#x27;+icon(&#x27;circle-check&#x27;)+&#x27;导出交互示意已完成。本预览未生成真实交付文件。&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;p class=&quot;cw-small cw-muted&quot;&gt;系统内部选定用于记录决策；正式审批与实施由相应责任人员完成。&lt;/p&gt;&#x27;;}
  function footer(){const prev=state.step&gt;0?go(icon(&#x27;arrow-left&#x27;)+&#x27;上一步&#x27;,state.step-1):&#x27;&lt;span class=&quot;cw-footer-status&quot;&gt;&#x27;+icon(&#x27;map-pinned&#x27;)+&#x27;先选路段，再新建维修方案&lt;/span&gt;&#x27;;let next=&#x27;&#x27;;if(state.step===0)next=go(&#x27;新建维修方案&#x27;+icon(&#x27;arrow-right&#x27;),1,true);if(state.step===1)next=go(&#x27;保存并进入仿真&#x27;+icon(&#x27;arrow-right&#x27;),2,true);if(state.step===2)next=go(&#x27;查看影响分析&#x27;+icon(&#x27;arrow-right&#x27;),3,true);if(state.step===3)next=go(&#x27;生成并比较候选方案&#x27;+icon(&#x27;arrow-right&#x27;),4,true);if(state.step===4)next=go(&#x27;确认方案并准备导出&#x27;+icon(&#x27;arrow-right&#x27;),5,true);if(state.step===5)next=button(icon(&#x27;download&#x27;)+&#x27;导出评估包&#x27;,&#x27;export&#x27;,true);return &#x27;&lt;footer class=&quot;cw-footer&quot;&gt;&#x27;+prev+&#x27;&lt;span class=&quot;cw-footer-status&quot;&gt;&#x27;+icon(&#x27;shield-check&#x27;)+(state.step===0?&#x27;地图、指标与费用均为示例&#x27;:state.step===5?&#x27;报告与所选方案保持同一版本&#x27;:&#x27;流程 &#x27;+state.step+&#x27; / 5 · 输入与当前项目关联&#x27;)+&#x27;&lt;/span&gt;&#x27;+next+&#x27;&lt;/footer&gt;&#x27;;}
  function render(){
    root.style.colorScheme=state.theme;root.dataset.step=String(state.step);root.dataset.panel=design.panel;
