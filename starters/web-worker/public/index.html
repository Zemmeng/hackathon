<!doctype html>
<!-- 改 CSS/JS 后把 ?v= 都 +1（或跑 bump.sh），否则浏览器拿旧缓存 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>房间骨架</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='20' fill='%233b6fd8'/></svg>">
  <link rel="stylesheet" href="style.css?v=1">
  <script type="module" src="js/app.js?v=1"></script>
</head>
<body data-smoke="ok">
  <header class="bar">
    <h1>房间骨架</h1>
    <span id="health" class="pill">检测中…</span>
    <span id="mock-badge" class="pill mock" hidden title="后端不可用：规则在本页用 logic.js 跑，只有你自己看得到">MOCK</span>
  </header>

  <main>
    <!-- 首页：建房 / 进房 -->
    <section id="home" class="card">
      <label class="field">
        <span>昵称</span>
        <input id="nick" maxlength="12" placeholder="随便起个名字" autocomplete="off">
      </label>
      <button id="btn-create" class="primary">创建房间</button>
      <div class="row">
        <input id="join-code" maxlength="5" placeholder="房间码" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="btn-join">进入房间</button>
      </div>
      <p id="home-err" class="err" role="alert"></p>
    </section>

    <!-- 房间 -->
    <section id="room" hidden>
      <div class="card room-head">
        <div>
          <div class="muted">房间码</div>
          <div id="room-code" class="code">-----</div>
        </div>
        <span id="conn" class="pill"></span>
        <div class="row tight">
          <button id="btn-copy">复制链接</button>
          <button id="btn-leave" class="ghost">离开</button>
        </div>
      </div>

      <div class="card counter-card">
        <div class="muted">共享计数</div>
        <div id="counter" class="counter"><span id="counter-num">0</span></div>
        <div class="row center">
          <button id="btn-dec" class="big" aria-label="减一">−1</button>
          <button id="btn-inc" class="big primary" aria-label="加一">+1</button>
        </div>
        <div id="rounds" class="muted small"></div>
      </div>

      <div class="card">
        <div class="muted">我的暗号（只有我看得到）</div>
        <div id="my-secret" class="secret">—</div>
        <form id="secret-form" class="row">
          <input id="secret-input" maxlength="40" placeholder="改成新的暗号" autocomplete="off">
          <button type="submit">保存</button>
        </form>
      </div>

      <div class="card">
        <div class="muted">成员</div>
        <ul id="members" class="members"></ul>
      </div>

      <div class="card">
        <div class="muted">消息</div>
        <ol id="log" class="log"></ol>
        <form id="say-form" class="row">
          <input id="say-input" maxlength="120" placeholder="说点什么" autocomplete="off">
          <button type="submit" class="primary">发送</button>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
