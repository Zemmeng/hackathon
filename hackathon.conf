# hackathon.conf —— 比赛元数据，全仓库只维护这一份
# 🔒 只有 lead 改。绝不写任何 key / token（那些放 .env 或 wrangler secret）。
# 时间一律写 TZ 那个时区的本地时间（YYYY-MM-DD HH:MM），不写死 UTC 偏移：
#   墨尔本 2026-10-04 02:00 进入夏令时，脚本用 python3 zoneinfo 按 TZ 现算。
# hooks / check.sh / deploy.sh / sync.sh 都从这里读倒计时、冻结时间和部署人。

# 赛事名称与官网（赛题公布后填）
EVENT_NAME=FEIT Hackathon Festival 2026
EVENT_URL=https://canvas.lms.unimelb.edu.au/courses/244146

# 时区名（IANA），不是偏移
TZ=Australia/Melbourne

# 开赛 / 截止（本地时间）。DEADLINE 为空时脚本显示「未设置」，不报错
START=2026-09-29 09:30
DEADLINE=2026-10-01 12:00

# 冻结：截止前 N 小时。48h 赛制默认 6/2；24h 赛制可改成 4/1
FEATURE_FREEZE_HOURS=6
CODE_FREEZE_HOURS=2

# 人：GitHub handle，不带 @
LEAD=Zemmeng
BACKUP_LEAD=Zemmeng
DEPLOYER=unicornnnnnny

# 线上地址（M1 部署打通后填；README 顶部的 Demo 链接必须与它一致）
DEMO_URL=
VIDEO_URL=

# 要部署的模块（apps/ 下的目录名，空格分隔；kickoff 后填）
DEPLOY_MODULES=
