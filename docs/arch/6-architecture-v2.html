<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RippleTwin 系统架构</title>
<!-- 产品架构图（给评审看，放初筛 3 页 PDF 第 3 页）。源文件：改下面 script 里的文字和坐标，浏览器打开就是图。
     中文版打开本文件，英文版加 ?lang=en。画布 16:9（和幻灯片一样），导出 = 打印、边距「无」；导出的 -zh / -en 的 .pdf .png 放在旁边。 -->
<style>
  @page { size: 13.333in 7.5in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 100%; height: auto; }
  @media print { svg { width: 13.333in; height: 7.5in; } }
  text { font-family: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, "WenQuanYi Zen Hei", sans-serif; }
</style>
</head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"></svg>
<script>
const EN = new URLSearchParams(location.search).get('lang') === 'en';
const t = (en, zh) => (EN ? en : zh);
document.documentElement.lang = EN ? 'en' : 'zh-CN';
document.title = t('RippleTwin system architecture', 'RippleTwin 系统架构');

const C = {
  orange: { stroke: '#E0852B', fill: '#FFF5EA', ink: '#A55810' },
  green:  { stroke: '#2E9A5A', fill: '#EDF8F1', ink: '#1E6E3F' },
  blue:   { stroke: '#2F6BD0', fill: '#EEF4FD', ink: '#1F4F9E' },
  purple: { stroke: '#7A4CC8', fill: '#F4EEFC', ink: '#5A33A0' },
  red:    { stroke: '#D14343', fill: '#FDEFEF', ink: '#A12C2C' },
  grey:   { stroke: '#8B919A', fill: '#F6F7F9', ink: '#454B54' },
};
const INK = '#1F2328', MUTED = '#565D67';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('d');

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function text(x, y, s, o = {}) {
  const e = el('text', { x, y, 'font-size': o.size || 18, fill: o.color || INK,
    'font-weight': o.weight || 400, 'text-anchor': o.anchor || 'middle' });
  e.textContent = s;
  return e;
}
const width = (s, size, weight = 400) => { const e = text(0, -99, s, { size, weight, anchor: 'start' }); const w = e.getComputedTextLength(); e.remove(); return w; };
const rect = (x, y, w, h, kind, o = {}) => el('rect', { x, y, width: w, height: h, rx: o.rx ?? 12,
  fill: o.fill || C[kind].fill, stroke: C[kind].stroke, 'stroke-width': o.sw || 2.5 });

function badge(xr, y, s) {
  const w = width(s, 15, 700) + 18;
  el('rect', { x: xr - w, y: y - 13, width: w, height: 26, rx: 7, fill: C.purple.stroke });
  text(xr - w / 2, y + 6, s, { size: 15, weight: 700, color: '#fff' });
}
// 框 + 居中的标题和几行字：整块文字在框里上下、左右都居中
function box(b) {
  rect(b.x, b.y, b.w, b.h, b.kind, b);
  const ts = b.ts || 22, ss = b.ss || 18, g = b.g ?? ts + 8, lh = b.lh || ss + 8, n = (b.sub || []).length;
  const block = 0.82 * ts + (n ? g + (n - 1) * lh + 0.2 * ss : 0.18 * ts);
  const cx = b.x + b.w / 2;
  let y = b.y + (b.h - block) / 2 + 0.82 * ts;
  text(cx, y, b.title, { size: ts, weight: b.tw || 700, color: b.titleColor || INK });
  y += g;
  for (const s of b.sub || []) { text(cx, y, s, { size: ss, color: MUTED }); y += lh; }
  if (b.ai) badge(b.x + b.w - 12, b.y, 'AI');
}
// 分组容器：浅底色 + 顶上居中的组名
function group(x, y, w, h, kind, title, o = {}) {
  rect(x, y, w, h, kind, { rx: 16, sw: o.sw || 2.5 });
  text(x + w / 2, y + (o.ty || 40), title, { size: o.ts || 24, weight: 700, color: C[kind].ink });
}
// 一行的框：加粗的名字 + 正文，整行居中
function strip(x, y, w, h, kind, head, body) {
  rect(x, y, w, h, kind, { rx: 12 });
  const hw = width(head, 20, 700), bw = width(body, 20), gap = 18, x0 = x + (w - hw - gap - bw) / 2, by = y + h / 2 + 7;
  text(x0, by, head, { size: 20, weight: 700, color: C[kind].ink, anchor: 'start' });
  text(x0 + hw + gap, by, body, { size: 20, color: INK, anchor: 'start' });
}

const defs = el('defs', {});
for (const k of Object.keys(C)) {
  const m = el('marker', { id: 'm-' + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 13, markerHeight: 13,
    markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: C[k].stroke }, m);
}
function arrow(pts, o = {}) {
  const k = o.kind || 'grey';
  el('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: C[k].stroke,
    'stroke-width': o.sw || 2.5, 'stroke-linejoin': 'round', 'marker-end': `url(#m-${k})`,
    ...(o.both ? { 'marker-start': `url(#m-${k})` } : {}), ...(o.dashed ? { 'stroke-dasharray': '9 7' } : {}) });
}

// ───────── 标题 ─────────
text(800, 72, t('RippleTwin — System Architecture', 'RippleTwin 系统架构'), { size: 44, weight: 700 });
text(800, 116, t('See how every road user reacts — before the cones go out',
                 '摆设备之前，先看到每类路人怎么走、哪里会堵'), { size: 22, color: MUTED });

// ───────── 上排三列：真实数据 → 引擎 ⇄ AI ─────────
const TOP = 152, BOT = 500;

group(40, TOP, 300, BOT - TOP, 'orange', t('Real data', '真实数据'));
[t('OSM street network', 'OSM 真实路网'), t('SCATS traffic counts', 'SCATS 真实车流'), t('Pedestrians & trams', '行人 · 电车'),
 t('RPM Hire equipment', 'RPM Hire 设备'), t('Research evidence', '研究文献')].forEach((title, i) => {
  box({ x: 56, y: 212 + i * 56.5, w: 268, h: 46, kind: 'orange', fill: '#fff', sw: 2, rx: 10, title, ts: 20, tw: 600 });
});

group(390, TOP, 780, BOT - TOP, 'green', t('Digital-twin engine', '数字孪生引擎'), { ts: 31, ty: 44, sw: 3.5 });
text(780, 230, t('Runs in the browser · same input, same result', '在浏览器里运行 · 同样输入同样结果'), { size: 18.5, color: MUTED });
[
  [t('4 traveller types', '4 类路人'), t('each with its own habits', '通勤 · 本地 · 游客 · 送货')],
  [t('Detour finder', '找绕行路线'), t('up to 3 routes', '最多 3 条')],
  [t('Route choice', '路线选择'), t('who follows the sign', '谁照屏上说的走')],
  [t('Traffic & queues', '分流与排队'), t('delay on every street', '每条路的延误')],
  [t('Clash check', '施工叠加'), t('overlapping works', '附近施工撞不撞')],
  [t('Before vs after', '前后对比'), t('every fix re-run', '每个改法都重算')],
].forEach(([title, sub], i) => {
  const c = i % 3, r = Math.floor(i / 3), x = 412 + c * 252, y = 250 + r * 126;
  box({ x, y, w: 232, h: 108, kind: 'green', fill: '#fff', sw: 2, rx: 10, title, sub: [sub], ts: 23.5, ss: 18.5, g: 34 });
  if (c < 2) arrow([[x + 232, y + 54], [x + 250, y + 54]], { kind: 'green', sw: 2 });
});

group(1230, TOP, 330, BOT - TOP, 'purple', t('AI agents', 'AI 智能体'));
box({ x: 1246, y: 212, w: 298, h: 128, kind: 'purple', fill: '#fff', sw: 2, rx: 10, title: t('AI road users', 'AI 路人'),
  ts: 24, ss: 19, g: 36, lh: 27, sub: [t('Plays each traveller type', '扮演 4 类路人'), t('and reads the signs', '读懂屏上的字')] });
box({ x: 1246, y: 356, w: 298, h: 128, kind: 'purple', fill: '#fff', sw: 2, rx: 10, title: t('AI planning advisor', 'AI 规划顾问'),
  ts: 24, ss: 19, g: 36, lh: 27, sub: [t('Suggests 3 fixes,', '给出 3 个改法'), t('the engine re-runs each', '引擎逐个重算')] });

arrow([[340, 326], [388, 326]], { kind: 'orange' });
arrow([[1172, 276], [1228, 276]], { kind: 'purple', both: true });
arrow([[1172, 420], [1228, 420]], { kind: 'purple', both: true });

// ───────── 引擎 ↔ 流程 ─────────
arrow([[520, 562], [520, 502]], { kind: 'blue' });
text(506, 539, t('Plan', '施工方案'), { size: 19, weight: 700, color: C.blue.ink, anchor: 'end' });
arrow([[1040, 502], [1040, 560]], { kind: 'green' });
text(1054, 539, t('Results: where it jams, how long', '结果：哪里堵、堵多久'), { size: 19, weight: 700, color: C.green.ink, anchor: 'start' });

// ───────── 中排：规划员流程（蓝） ─────────
group(40, 562, 1520, 178, 'blue', t('How a planner uses it', '规划员怎么用'), { ts: 23, ty: 36 });
[
  [t('① Plan the works', '① 画施工')], [t('② Signs are read', '② 路人读屏'), true], [t('③ Simulate', '③ 算影响')],
  [t('④ Check clashes', '④ 查冲突')], [t('⑤ Compare & fix', '⑤ 对比改进'), true],
].forEach(([title, ai], i) => {
  const x = 64 + i * 302;
  box({ x, y: 616, w: 262, h: 64, kind: 'blue', fill: '#fff', sw: 2, rx: 10, title, ai, ts: 23 });
  if (i < 4) arrow([[x + 262, 648], [x + 300, 648]], { kind: 'blue' });
});
arrow([[1403, 680], [1403, 712], [195, 712], [195, 683]], { kind: 'blue', dashed: true });
{
  const s = t('Adjust and run again', '改方案，再跑一遍'), w = width(s, 19, 700) + 28;
  el('rect', { x: 800 - w / 2, y: 698, width: w, height: 28, fill: C.blue.fill });
  text(800, 719, s, { size: 19, weight: 700, color: C.blue.ink });
}

// ───────── 下排：原则 + 关卡 ─────────
strip(40, 766, 750, 80, 'grey', t('Principle', '设计原则'), t('AI interprets — the engine calculates', 'AI 出主意，引擎算数字'));
strip(810, 766, 750, 80, 'red', t('Safeguards', '内置关卡'), t('VMS text check · AI fallback · keys stay on server', '屏上文字检查 · AI 兜底 · 密钥不出服务器'));
</script>
</body>
</html>
