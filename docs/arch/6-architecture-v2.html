<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RippleTwin 系统架构</title>
<!-- 产品架构图（给评审看，放初筛 3 页 PDF 第 3 页）。源文件：改下面 script 里的文字和坐标，浏览器打开就是图。
     中文版打开本文件，英文版加 ?lang=en。导出 = 打印成 A4 横向、边距「无」；导出的 -zh / -en 的 .pdf .png 放在旁边。 -->
<style>
  @page { size: A4 landscape; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 100%; height: auto; }
  @media print { svg { width: 297mm; height: 210mm; } }
  text { font-family: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", "Helvetica Neue", Arial, "WenQuanYi Zen Hei", sans-serif; }
</style>
</head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131"></svg>
<script>
const EN = new URLSearchParams(location.search).get('lang') === 'en';
const t = (en, zh) => (EN ? en : zh);
document.documentElement.lang = EN ? 'en' : 'zh-CN';
document.title = t('RippleTwin system architecture', 'RippleTwin 系统架构');

const C = {
  orange: { stroke: '#E0852B', fill: '#FFF5EA', ink: '#A55810' },
  green:  { stroke: '#2E9A5A', fill: '#EDF8F1', ink: '#1E6E3F' },
  blue:   { stroke: '#2F6BD0', fill: '#EEF4FD', ink: '#1F4F9E' },
  purple: { stroke: '#7A4CC8', fill: '#F4EEFC', ink: '#5A33A0' },
  red:    { stroke: '#D14343', fill: '#FDEFEF', ink: '#A12C2C' },
  grey:   { stroke: '#8B919A', fill: '#F6F7F9', ink: '#454B54' },
};
const INK = '#1F2328', MUTED = '#565D67';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('d');

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function text(x, y, s, o = {}) {
  const e = el('text', { x, y, 'font-size': o.size || 16, fill: o.color || INK,
    'font-weight': o.weight || 400, 'text-anchor': o.anchor || 'start' });
  e.textContent = s;
  return e;
}
const width = (s, size, weight = 400) => { const e = text(0, -99, s, { size, weight }); const w = e.getComputedTextLength(); e.remove(); return w; };

function badge(xr, y, s, kind) {
  const w = width(s, 14, 700) + 16;
  el('rect', { x: xr - w, y: y - 12, width: w, height: 24, rx: 6, fill: C[kind].stroke });
  text(xr - w / 2, y + 5, s, { size: 14, weight: 700, color: '#fff', anchor: 'middle' });
}
function box(b) {
  const c = C[b.kind];
  el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: b.rx ?? 12, fill: b.fill || c.fill,
    stroke: c.stroke, 'stroke-width': b.sw || 2.5 });
  const px = b.x + (b.px || 16);
  let y = b.y + (b.ty || 34);
  if (b.title) { text(px, y, b.title, { size: b.ts || 21, weight: 700 }); y += b.gap || 28; }
  for (const s of b.sub || []) { text(px, y, s, { size: b.ss || 16, color: MUTED }); y += b.lh || 22; }
  if (b.ai) badge(b.x + b.w - 12, b.y, 'AI', 'purple');
}

const defs = el('defs', {});
for (const k of Object.keys(C)) {
  const m = el('marker', { id: 'm-' + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 12, markerHeight: 12,
    markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: C[k].stroke }, m);
}
function arrow(pts, o = {}) {
  const k = o.kind || 'grey';
  el('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: C[k].stroke,
    'stroke-width': o.sw || 2.2, 'stroke-linejoin': 'round', ...(o.noHead ? {} : { 'marker-end': `url(#m-${k})` }),
    ...(o.dashed ? { 'stroke-dasharray': '8 6' } : {}) });
}

// ───────── 标题 ─────────
text(40, 70, t('RippleTwin — System Architecture', 'RippleTwin 系统架构'), { size: 40, weight: 700 });
text(40, 110, t('Test a roadwork plan on Melbourne’s real streets — see how every road user reacts before the cones go out.',
                '在墨尔本真实路网上试摆施工方案：摆设备之前，先看到各类路人会怎么走、哪里会堵'), { size: 20, color: MUTED });

// ───────── 左：真实数据（橙） ─────────
text(40, 158, t('Real data', '真实数据'), { size: 18, weight: 700, color: C.orange.ink });
const inputs = [
  [t('Street network', '真实路网'), t('OpenStreetMap · Melbourne CBD', 'OpenStreetMap · 墨尔本 CBD')],
  [t('Traffic counts', '真实车流'), t('SCATS detectors · 8 weeks', 'SCATS 路口检测器 · 8 周')],
  [t('Pedestrians & trams', '行人与电车'), t('City sensors · PTV timetable', '市政行人计数 · PTV 时刻表')],
  [t('RPM Hire equipment', 'RPM Hire 设备'), t('Barriers · signs · VMS · arrows', '护栏 · 标志牌 · VMS · 箭头板')],
  [t('Research evidence', '研究文献'), t('Traveller mix · trust in signs', '路人构成 · 信不信屏')],
];
inputs.forEach(([title, sub], i) => {
  const y = 172 + i * 92;
  box({ x: 40, y, w: 290, h: 80, kind: 'orange', title, sub: [sub], ty: 32, gap: 26 });
  arrow([[330, y + 40], [355, y + 40]], { kind: 'orange', noHead: true });
});
arrow([[355, 212], [355, 580]], { kind: 'orange', noHead: true });
arrow([[355, 396], [378, 396]], { kind: 'orange' });

box({ x: 40, y: 730, w: 290, h: 110, kind: 'orange', title: t('RPM Hire planner', 'RPM 施工规划员'),
  sub: [t('Opens one web link —', '打开一个网址就能用'), t('nothing to install', '不用安装')] });
arrow([[330, 790], [398, 790]], { kind: 'orange' });

// ───────── 中：数字孪生引擎（绿） ─────────
const H = { x: 380, y: 140, w: 700, h: 490 };
el('rect', { x: H.x, y: H.y, width: H.w, height: H.h, rx: 16, fill: C.green.fill, stroke: C.green.stroke, 'stroke-width': 3.5 });
text(402, 182, t('Digital-twin engine', '数字孪生引擎'), { size: 28, weight: 700, color: C.green.ink });
text(402, 214, t('Runs in the browser · same plan, same result · re-run hundreds of times',
                 '在浏览器里运行 · 同样的方案同样的结果 · 可以反复试几百次'), { size: 17, color: MUTED });
const cells = [
  [t('Traveller types', '4 类路人'), [t('commuter · local ·', '通勤 · 本地 ·'), t('tourist · delivery', '游客 · 送货')]],
  [t('Detour finder', '找绕行路线'), [t('who is affected,', '谁受影响'), t('up to 3 detours', '最多 3 条绕行')]],
  [t('Route choice', '路线选择'), [t('who follows the sign,', '谁照屏上说的走'), t('who stays put', '谁留在原路')]],
  [t('Traffic & queues', '分流与排队'), [t('delay and queue', '每条路的'), t('on every street', '延误和排队长度')]],
  [t('Clash check', '施工叠加'), [t('other works nearby', '附近同时段的'), t('at the same time', '其他施工撞不撞')]],
  [t('What-if compare', '改前改后对比'), [t('every fix is', '每个改法'), t('re-simulated', '都重新算一遍')]],
];
cells.forEach(([title, sub], i) => {
  const x = 402 + (i % 3) * 223, y = 240 + Math.floor(i / 3) * 190;
  box({ x, y, w: 210, h: 170, kind: 'green', fill: '#fff', sw: 2, title, sub, ty: 44, gap: 38, lh: 24, ts: 20 });
});

// ───────── 右：AI 智能体（紫） ─────────
text(1140, 158, t('AI agents', 'AI 智能体'), { size: 18, weight: 700, color: C.purple.ink });
box({ x: 1140, y: 172, w: 420, h: 170, kind: 'purple', title: t('AI road users', 'AI 路人'), ts: 22, ty: 40, gap: 34, lh: 25,
  sub: [t('Reads the VMS as each traveller:', '以每类路人的身份读屏上的字：'),
        t('seen? understood? trusted?', '看到没 · 看懂没 · 信不信'),
        t('which way does it say to go?', '叫我走哪条')] });
box({ x: 1140, y: 382, w: 420, h: 150, kind: 'purple', title: t('AI planning advisor', 'AI 规划顾问'), ts: 22, ty: 40, gap: 34, lh: 25,
  sub: [t('Suggests up to 3 fixes:', '给出最多 3 个改法：'),
        t('reword · move a sign · reschedule', '改字 · 挪设备 · 错开日期')] });
const mid = 1110;
arrow([[1082, 240], [1138, 240]], { kind: 'purple' });
text(mid, 230, t('sign text', '屏上的字'), { size: 14, color: C.purple.ink, anchor: 'middle' });
arrow([[1138, 282], [1082, 282]], { kind: 'purple' });
text(mid, 302, t('readings', '读数'), { size: 14, color: C.purple.ink, anchor: 'middle' });
arrow([[1082, 436], [1138, 436]], { kind: 'purple' });
text(mid, 426, t('plan', '方案'), { size: 14, color: C.purple.ink, anchor: 'middle' });
arrow([[1138, 478], [1082, 478]], { kind: 'purple' });
text(mid, 498, t('fixes', '改法'), { size: 14, color: C.purple.ink, anchor: 'middle' });
text(1140, 570, t('AI interprets — the engine does the maths', 'AI 出主意，引擎算数字'), { size: 18, weight: 700, color: C.purple.ink });

// ───────── 下：规划员流程（蓝） ─────────
const W = { x: 380, y: 690, w: 1180, h: 222 };
el('rect', { x: W.x, y: W.y, width: W.w, height: W.h, rx: 16, fill: '#F8FBFF', stroke: C.blue.stroke, 'stroke-width': 2 });
text(402, 724, t('How a planner uses it', '规划员怎么用'), { size: 20, weight: 700, color: C.blue.ink });
const steps = [
  [t('① Plan the works', '① 画施工'), [t('street, barriers,', '选路段 · 摆设备'), t('signs, VMS text', '写屏上的字')]],
  [t('② Signs are read', '② 路人读屏'), [t('each traveller type', '4 类路人'), t('reads the signs', '各读一遍')], true],
  [t('③ Simulate', '③ 算影响'), [t('detours, queues,', '分流 · 排队'), t('delay per person', '每人多花几分钟')]],
  [t('④ Check clashes', '④ 查冲突'), [t('overlapping works', '附近施工叠加'), t('nearby', '多出来的代价')]],
  [t('⑤ Compare & fix', '⑤ 对比改进'), [t('before vs after,', '改前改后对比'), t('AI-suggested fixes', 'AI 给改法')], true],
];
steps.forEach(([title, sub, ai], i) => {
  const x = 400 + i * 234;
  box({ x, y: 742, w: 206, h: 112, kind: 'blue', title, sub, ai, ts: 20, ty: 34, gap: 28, lh: 22 });
  if (i < steps.length - 1) arrow([[x + 206, 798], [x + 232, 798]], { kind: 'blue' });
});
arrow([[1439, 854], [1439, 876], [503, 876], [503, 857]], { kind: 'blue', dashed: true });
text(971, 902, t('Adjust the plan and run again', '改方案，再跑一遍'), { size: 17, weight: 700, color: C.blue.ink, anchor: 'middle' });

// 引擎 ↔ 流程：上行的方案过关卡，下行的是结果
arrow([[503, 690], [503, 632]], { kind: 'blue' });
{
  const head = t('VMS check', '屏上文字检查'), rest = t('≤ 2 frames × 4 lines × 10 chars', '≤ 2 帧 × 4 行 × 每行 10 字符');
  const w = width(head, 16, 700) + width(rest, 16) + 40;
  el('rect', { x: 420, y: 644, width: w, height: 34, rx: 8, fill: C.red.fill, stroke: C.red.stroke, 'stroke-width': 2 });
  text(436, 667, head, { size: 16, weight: 700, color: C.red.ink });
  text(436 + width(head, 16, 700) + 10, 667, rest, { size: 16, color: INK });
}
arrow([[971, 632], [971, 688]], { kind: 'green' });
text(988, 667, t('Results: where it jams · for how long · who is hit hardest', '结果：哪里堵 · 堵多久 · 哪类人最受影响'),
  { size: 17, weight: 700, color: C.green.ink });

// ───────── 最下：原则（灰）+ 关卡（红） ─────────
box({ x: 40, y: 940, w: 745, h: 126, kind: 'grey', title: t('Design principles', '设计原则'), ts: 20, ty: 34, gap: 29, lh: 25,
  sub: [t('• AI only interprets the signs; every number comes from the engine', '• AI 只读懂屏上的字，所有数字都由引擎算'),
        t('• Same plan, same result — plans can be compared fairly', '• 同样的方案同样的结果，方案之间能公平比较'),
        t('• Every number shows its source, or is marked “assumed”', '• 每个数都标出处，没出处的标「假设值」')] });
box({ x: 815, y: 940, w: 745, h: 126, kind: 'red', title: t('Built-in safeguards', '内置关卡'), ts: 20, ty: 34, gap: 29, lh: 25,
  sub: [t('• Sign text checked against VMS limits before simulating', '• 屏上的字先按 VMS 规格检查，再进仿真'),
        t('• AI answers cached; rule-based fallback if the AI is down', '• AI 回答有缓存，AI 连不上就用规则兜底'),
        t('• API keys stay on the server, never in the browser', '• API 密钥只放在服务器上，不进浏览器')] });

// ───────── 图例 ─────────
let lx = 40;
const legend = [
  ['orange', t('Real data', '真实数据')], ['green', t('Simulation engine', '仿真引擎')], ['purple', t('AI agents', 'AI 智能体')],
  ['blue', t('Planner workflow', '规划员流程')], ['red', t('Safeguards', '关卡')],
];
for (const [k, s] of legend) {
  el('rect', { x: lx, y: 1095, width: 26, height: 16, rx: 4, fill: C[k].fill, stroke: C[k].stroke, 'stroke-width': 2.5 });
  text(lx + 34, 1109, s, { size: 16 });
  lx += 34 + width(s, 16) + 30;
}
arrow([[lx, 1103], [lx + 36, 1103]], { kind: 'blue', dashed: true });
text(lx + 46, 1109, t('Loops back', '回头再算'), { size: 16 });
text(1560, 1109, t('FEIT Hackathon 2026 · Challenge 5 · RPM Hire', 'FEIT Hackathon 2026 · 第 5 题 · RPM Hire'), { size: 15, color: MUTED, anchor: 'end' });
</script>
</body>
</html>
