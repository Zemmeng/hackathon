const INK = '#1F2328', MUTED = '#5F6670';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('d');

function el(tag, attrs, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function text(x, y, s, o = {}) {
  const t = el('text', { x, y, 'font-size': o.size || 13, fill: o.color || INK,
    'font-weight': o.weight || 400, 'text-anchor': o.anchor || 'start' });
  if (o.mono) t.setAttribute('class', 'mono');
  t.textContent = s;
  return t;
}
const width = (s, size, weight = 400) => { const t = text(0, -99, s, { size, weight }); const w = t.getComputedTextLength(); t.remove(); return w; };

// 右上角的小标签，压在边框上；多个从右往左排
function tags(xr, y, list) {
  for (const [s, kind] of list.slice().reverse()) {
    const w = width(s, 11, 700) + 14;
    el('rect', { x: xr - w, y: y - 10, width: w, height: 20, rx: 5, fill: C[kind].stroke });
    text(xr - w / 2, y + 4, s, { size: 11, weight: 700, color: '#fff', anchor: 'middle' });
    xr -= w + 5;
  }
}
function box(b) {
  const c = C[b.kind];
  el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: b.rx ?? 10, fill: b.fill || c.fill,
    stroke: b.stroke || c.stroke, 'stroke-width': b.sw || 2, ...(b.dashed ? { 'stroke-dasharray': '7 5' } : {}) });
  const px = b.x + (b.px || 14);
  let y = b.y + (b.ty || 26);
  if (b.title) { text(px, y, b.title, { size: b.ts || 16, weight: 700, color: b.titleColor || INK }); y += b.gap || 22; }
  for (const s of b.sub || []) { text(px, y, s, { size: b.ss || 13, color: MUTED }); y += b.lh || 18.5; }
  for (const s of b.mono || []) { text(px, y + 1, s, { size: 12, color: c.ink, mono: true }); y += 17; }
  if (b.tags) tags(b.x + b.w - 10, b.y, b.tags);
}
// 关卡：红框，第一行「关卡」加粗
function gate(g) {
  el('rect', { x: g.x, y: g.y, width: g.w, height: g.h, rx: 8, fill: C.red.fill, stroke: C.red.stroke, 'stroke-width': 1.8 });
  const t = text(g.x + 12, g.y + 18, '', { size: 12.5 });
  const a = el('tspan', { 'font-weight': 700, fill: C.red.ink }, t); a.textContent = g.head + '  ';
  const b = el('tspan', { fill: INK }, t); b.textContent = g.l1;
  text(g.x + 12, g.y + 35, g.l2, { size: 12, color: MUTED });
}

const defs = el('defs', {});
for (const k of Object.keys(C)) {

  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: C[k].stroke }, m);
}
function arrow(pts, o = {}) {
  const k = o.kind || 'grey';
  el('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: C[k].stroke,
